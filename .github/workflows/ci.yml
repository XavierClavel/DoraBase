name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la seule source de vérité sur la version de pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # La toolchain Rust est épinglée dans src-tauri/rust-toolchain.toml (canal +
      # composants) : rustup l'installe elle-même à la première commande cargo/rustc
      # exécutée dans ce dossier. Pas d'action dédiée ici, pour garder une seule
      # source de vérité sur la version de Rust.
      - run: rustup show
        working-directory: src-tauri

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      # Un marqueur de sabotage laissé par un contrôle négatif ne casse rien — c'est
      # justement le problème. Voir l'en-tête du script.
      - run: ./scripts/verifier-aucun-sabotage.sh

      - run: pnpm typecheck
      - run: pnpm lint

      # Garde-fous : ces fichiers sont générés, jamais édités à la main. Régénérer puis
      # exiger un diff vide échoue si quelqu'un y a touché — ou si la source a bougé sans
      # que la sortie soit reconstruite.
      #   tokens : `tokens.css` et `tokens.ts` depuis `tokens.json`
      #   icônes : `sprite.svg` et `names.ts` depuis le mockup du handoff
      - run: pnpm tokens:check
      - run: pnpm icons:check

      #   domaine : `src/domain/config.ts`, projeté depuis les types Rust par ts-rs.
      #   `ts-rs` exporte pendant `cargo test`, et la sortie est reformatée par Biome —
      #   chaîne déterministe, vérifiée par deux générations successives identiques.
      - run: pnpm domain:check

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # `test-results/` porte les captures réelle/attendue/diff produites par
          # l'échec — c'est ce qu'on récupère pour committer la référence générée en
          # CI. `playwright-report/` est le rapport HTML de navigation, utile en plus.
          path: |
            playwright-report/
            test-results/

      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      # `clippy --all-targets` **compile** les tests mais ne les exécute pas : un test
      # qui échoue passait donc la CI en silence, jusqu'au 5 août 2026. Constaté par
      # contrôle négatif — un `assert_eq!(1, 2)` laissait clippy vert.
      - run: cargo test
        working-directory: src-tauri
      # `cargo run` sans `--bin` doit rester non ambigu : c'est ce que `tauri dev` appelle,
      # et l'ajout du binaire `export-types` l'a cassé sans que la CI le voie — `tauri build`
      # ne passe pas par ce chemin.
      #
      # La propriété est vérifiée par `cargo metadata`, et non en lançant `cargo run` : l'app
      # ne traite aucun argument, donc elle ouvrirait une fenêtre et bloquerait le runner.
      # `cargo run` sans `--bin` doit rester non ambigu : c'est ce que `tauri dev` appelle,
      # et l'ajout du binaire `export-types` l'a cassé sans que la CI le voie — `tauri build`
      # ne passe pas par ce chemin. Voir l'en-tête du script pour le détail.
      - name: cargo run reste non ambigu (default-run)
        working-directory: src-tauri
        run: cargo metadata --format-version 1 --no-deps | python3 ../scripts/verifier-default-run.py

      - run: pnpm tauri build

  # Second job, sur Linux, dédié aux tests qui exigent une vraie base.
  #
  # Pourquoi un job séparé : les *service containers* de GitHub Actions n'existent que sur
  # les runners Linux, or le job `build` doit rester sur macOS pour produire le `.app`. Les
  # deux tournent en parallèle, donc la CI ne rallonge pas.
  #
  # Les tests concernés sont derrière la feature `db-tests` et non `#[ignore]` : sans la
  # feature ils n'existent pas, ce que le job macOS démontre par un compte à zéro.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La crate dépend de `tauri`, qui exige la pile GTK/WebKit sur Linux — même pour une
      # simple compilation de bibliothèque, `glib-sys` cherchant `glib-2.0.pc` par
      # `pkg-config`. Sans ces paquets, le job échoue avant d'atteindre le moindre test.
      #
      # C'est du gaspillage assumé : installer WebKit pour tester un adaptateur PostgreSQL.
      # La bonne forme serait d'extraire `config`, `secrets` et `engine` dans une crate
      # sans `tauri` — le domaine n'a aucune raison de dépendre du toolkit graphique. À
      # faire quand le coût de cette étape le justifiera.
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - run: rustup show
        working-directory: src-tauri

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Clé distincte de celle du job macOS : les cibles diffèrent, et les mélanger
          # ferait invalider un cache par l'autre.
          key: engine

      # Le décor PostgreSQL, **avec TLS** (`06f`), monté par le même script qu'en local. Le schéma
      # de test garde sa composition connue, sur laquelle les tests assènent des valeurs exactes.
      #
      # **Ce n'est plus un service container**, et c'est `06f` qui l'a imposé : le décor a besoin d'un
      # certificat dont le nom commun **ne correspond pas** à l'hôte joint, ce qui demande de passer
      # `-c ssl_cert_file=…` à `postgres` — pas exprimable dans les options d'un service container.
      # PostgreSQL rejoint donc MongoDB et MySQL : une seule façon de monter le décor, en local comme
      # ici, plutôt que deux qui divergent.
      - name: monter le décor PostgreSQL
        run: ./scripts/pg-test.sh demarrer
        env:
          DORABASE_TEST_PG_PORT: 5432

      # Le décor MongoDB de `18`, monté par le **même script** qu'en local.
      #
      # **Pas un service container** non plus : GitHub n'y accepte que des options `docker run`, et
      # `--replSet rs0` n'est pas exprimable. Or un `mongod` isolé ne sait pas ouvrir de transaction,
      # donc `18f` n'y testerait que son refus. Le script porte aussi les deux attentes (serveur, puis
      # élection du primaire) qui évitent un « not primary » intermittent.
      - name: monter le décor MongoDB
        run: ./scripts/mongo-test.sh demarrer
        env:
          DORABASE_TEST_MONGO_PORT: 27017

      # Le décor MySQL de `16`, monté par le **même script** qu'en local. Il porte l'attente
      # d'initialisation — MySQL crée son répertoire de données au premier démarrage, et trente
      # secondes ne suffisent pas toujours — et le `--default-character-set=utf8mb4` sans lequel le
      # décor entre en latin1 (défaut n° 59).
      - name: monter le décor MySQL
        run: ./scripts/mysql-test.sh demarrer
        env:
          DORABASE_TEST_MYSQL_PORT: 3306

      # Le bastion SSH de `06e`, monté par le **même script** qu'en local. Le conteneur
      # PostgreSQL est ici le *service container* de GitHub, dont le nom est engendré : le
      # script le retrouve par son image. Une seule définition de décor pour les deux
      # environnements, plutôt qu'une variante CI qu'on ne peut pas essayer localement — le
      # défaut qui a fait échouer le garde `default-run` (voir `REPRISE.md` § 6).
      - name: monter le bastion SSH
        run: ./scripts/bastion-test.sh demarrer "$RUNNER_TEMP/bastion"

      - name: tests, avec base et bastion
        working-directory: src-tauri
        run: |
          set -a
          . "$RUNNER_TEMP/bastion/bastion.env"
          set +a
          cargo test --features db-tests
        env:
          DORABASE_TEST_PG: postgres://dorabase:dorabase-test@localhost:5432/dorabase_test
          DORABASE_TEST_PG_CERTS: /tmp/dorabase-test-pg-certs
          DORABASE_TEST_MONGO: mongodb://localhost:27017
          DORABASE_TEST_MYSQL: mysql://dorabase:dorabase-test@localhost:3306/dorabase_test
          DORABASE_TEST_MYSQL_CA: /tmp/dorabase-test-mysql-ca.pem

      # Les tests SSH se **sautent** quand le décor manque, ce qui les rendrait invisibles si
      # le bastion échouait à démarrer sans casser le job. Cette étape refuse ce silence.
      - name: vérifier que les tests SSH ont bien tourné
        working-directory: src-tauri
        run: |
          set -a
          . "$RUNNER_TEMP/bastion/bastion.env"
          set +a
          sortie=$(cargo test --features db-tests tunnel -- --nocapture 2>&1)
          if echo "$sortie" | grep -q "décor SSH absent"; then
            echo "$sortie" | grep "décor SSH absent"
            echo "::error::des tests SSH ont été sautés alors que le bastion est censé tourner"
            exit 1
          fi
          echo "$sortie" | grep -c "^test engine::tunnel::tests_ssh" \
            | xargs -I{} echo "{} tests SSH exécutés"
        env:
          DORABASE_TEST_PG: postgres://dorabase:dorabase-test@localhost:5432/dorabase_test
          DORABASE_TEST_PG_CERTS: /tmp/dorabase-test-pg-certs
          DORABASE_TEST_MONGO: mongodb://localhost:27017
          DORABASE_TEST_MYSQL: mysql://dorabase:dorabase-test@localhost:3306/dorabase_test
          DORABASE_TEST_MYSQL_CA: /tmp/dorabase-test-mysql-ca.pem
