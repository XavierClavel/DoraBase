name: Publication

# Un tag `vX.Y.Z` poussé sur `main` construit le bundle macOS et l'attache à une release
# GitHub, d'où il est téléchargeable. Rien d'autre ne déclenche ce workflow : une publication
# est un geste, pas un effet de bord d'un push.
#
# Le geste complet, côté humain, est dans `scripts/version.sh` et dans le README.
on:
  push:
    tags:
      # Motif **ancré** sur les trois nombres : `v0.1.0-essai` ou `v1.2` ne publient pas. Le
      # format de version est fermé (voir `scripts/verifier-version.py`) ; un tag qui sort du
      # format produirait un nom de bundle que rien n'a décidé.
      - "v[0-9]+.[0-9]+.[0-9]+"

# La seule permission dont le job a besoin, et il en a besoin : créer la release et y attacher
# le `.dmg`. Le reste du jeton reste en lecture.
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    # Une stalle ne doit pas se déguiser en travail — même raison que le job `engine` de
    # `ci.yml`. Une construction universelle compile la crate deux fois : quarante minutes
    # laissent de la marge, une heure trente n'en serait plus.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # `git log v(précédent)..v(courant)` a besoin de l'historique et des tags ; un
          # checkout superficiel n'en a ni l'un ni l'autre, et les notes de version seraient
          # vides sans que rien ne le dise.
          fetch-depth: 0

      # **Le tag et les fichiers doivent dire le même numéro.** Un tag `v0.3.0` posé sur un
      # arbre resté en `0.2.0` publierait un `.dmg` nommé `0.2.0` sous une release `0.3.0` :
      # à partir de là, personne ne peut plus dire ce qu'il a installé. Vérifié **avant** de
      # compiler, pour échouer en dix secondes plutôt qu'en trente minutes.
      - name: le tag correspond à la version des fichiers
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          python3 scripts/verifier-version.py "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: rustup show
        working-directory: src-tauri

      # Les deux cibles du bundle universel. `aarch64` est déjà celle du runner ; `x86_64` est
      # une construction croisée, et c'est elle qui rend le `.dmg` installable sur les Mac
      # Intel encore sous Ventura — le plancher que le projet s'est donné.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: src-tauri

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Clé distincte de celle de `ci.yml` : ce job compile en `release` et pour deux
          # cibles. Partager la clé ferait invalider un cache par l'autre à chaque tour.
          key: publication

      - run: pnpm install --frozen-lockfile

      # **Les deux architectures du proxy, et leur fusion.** Tauri ne fond rien : pour
      # `--target universal-apple-darwin` il exige un fichier
      # `cloud-sql-proxy-universal-apple-darwin` déjà universel, et son absence n'apparaît
      # qu'au *bundling* — donc après cinq minutes de compilation. C'est
      # `telecharger-proxy.sh --tous` qui appelle `lipo`. Comme dans `ci.yml`, c'est une
      # dépendance de compilation et non une étape de packaging (défaut n° 111).
      - run: pnpm proxy:embarquer:tous

      # Le même fait, constaté en deux secondes plutôt qu'en cinq minutes. Le script vient de
      # produire ce fichier et vérifie déjà son contenu ; cette étape existe pour que l'échec
      # tombe **avant** la compilation, et le message dit quoi lancer.
      - name: le sidecar universel est là avant de compiler
        run: |
          set -euo pipefail
          universel=src-tauri/binaries/cloud-sql-proxy-universal-apple-darwin
          if [[ ! -f $universel ]]; then
            echo "::error::$universel manque — 'pnpm proxy:embarquer:tous' doit le fondre"
            exit 1
          fi
          archs=$(lipo -archs "$universel")
          echo "$universel : $archs"
          grep -q arm64 <<<"$archs"
          grep -q x86_64 <<<"$archs"

      # ── Ce qui doit être vrai avant de publier un binaire ──────────────────────────────
      #
      # Le tag est censé être posé sur un `main` déjà vert, et `scripts/version.sh` refuse de
      # le poser ailleurs. Mais « censé » n'est pas une vérification : ces quatre étapes-là
      # sont celles qui tiennent en quelques minutes, et elles rendent vraie la phrase « rien
      # n'est publié qui n'ait été vérifié ». Playwright et les tests sur base réelle restent
      # dans `ci.yml` : ils demandent un serveur et quatre décors, et ce job n'a pas à les
      # remonter pour la seconde fois.
      - run: ./scripts/verifier-aucun-sabotage.sh
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test
        working-directory: src-tauri

      # ── Signature et notarisation Apple ────────────────────────────────────────────────
      #
      # **Tout ce bloc est conditionnel.** Sans les secrets — un clone, un fork, une bifurcation
      # de travail —, la construction reste celle d'avant : signature ad hoc, application qui
      # demande un geste au premier lancement. Un workflow qui exige un certificat pour
      # s'exécuter rendrait le dépôt inconstructible pour tout le monde sauf son auteur.
      #
      # `NOTARISE` porte cette condition une seule fois : une expression répétée dans cinq `if`
      # finit par différer dans l'un des cinq.
      #
      # **Et les cinq secrets sont contrôlés ici, avant de compiler.** Un secret absent vaut la
      # chaîne vide, que Tauri passe telle quelle à `notarytool` : le 25 août 2026, un
      # `--issuer ''` a fait échouer la publication **après** la signature, donc après vingt
      # minutes de compilation — et le nom du secret fautif n'apparaissait nulle part, seulement
      # « must be a valid UUID ». Chaque forme est donc vérifiée, et le message nomme le secret.
      - name: signature Apple disponible ?
        env:
          IDENTITE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICAT: ${{ secrets.APPLE_CERTIFICATE }}
          MOT_DE_PASSE: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CLEF: ${{ secrets.APPLE_API_KEY }}
          EMETTEUR: ${{ secrets.APPLE_ISSUER_ID }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z ${IDENTITE:-} ]]; then
            echo "NOTARISE=non" >> "$GITHUB_ENV"
            echo "::notice::pas de secret APPLE_SIGNING_IDENTITY — signature ad hoc, sans notarisation"
            exit 0
          fi

          manquants=()
          [[ -n ${CERTIFICAT:-} ]] || manquants+=(APPLE_CERTIFICATE)
          [[ -n ${MOT_DE_PASSE:-} ]] || manquants+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n ${CLEF:-} ]] || manquants+=(APPLE_API_KEY)
          [[ -n ${EMETTEUR:-} ]] || manquants+=(APPLE_ISSUER_ID)
          [[ -n ${P8:-} ]] || manquants+=(APPLE_API_KEY_P8)
          if (( ${#manquants[@]} )); then
            echo "::error::signature demandée, mais ces secrets sont vides : ${manquants[*]}"
            echo "  la signature sans notarisation laisserait la fenêtre de Gatekeeper : ce job"
            echo "  refuse de publier à moitié." >&2
            exit 1
          fi

          # Les deux formes qu'Apple impose, et que l'on peut vérifier sans réseau. Un Issuer ID
          # est un UUID ; un Key ID fait dix caractères alphanumériques majuscules. Les avoir
          # échangés est l'erreur naturelle, les deux vivant dans le même écran.
          grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' \
            <<<"$EMETTEUR" || {
            echo "::error::APPLE_ISSUER_ID n'est pas un UUID — c'est l'« Issuer ID » d'App Store"
            echo "  Connect (Users and Access ▸ Integrations), pas le Key ID." >&2
            exit 1
          }
          grep -Eq '^[A-Z0-9]{8,12}$' <<<"$CLEF" || {
            echo "::error::APPLE_API_KEY ne ressemble pas à un Key ID (dix caractères, A-Z0-9)" >&2
            exit 1
          }
          grep -q '^Developer ID Application:' <<<"$IDENTITE" || {
            echo "::error::APPLE_SIGNING_IDENTITY doit commencer par « Developer ID Application: »" >&2
            exit 1
          }

          echo "NOTARISE=oui" >> "$GITHUB_ENV"
          echo "signature et notarisation Apple : activées, cinq secrets présents et bien formés"

      # La clé App Store Connect est un **fichier** pour `notarytool`, alors qu'un secret est une
      # chaîne : elle est donc écrite ici, en base64 inverse, hors de l'arbre de travail et en 600.
      # `printf` et une redirection, jamais un `echo` dans un pipeline : le masquage des logs ne
      # suit pas une valeur transformée.
      - name: écrire la clé API Apple
        if: env.NOTARISE == 'oui'
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          # Une clé tronquée ou mal encodée ne se voit qu'à l'échec de la soumission, vingt
          # minutes plus tard. `openssl` la **lit en entier** : un contrôle sur la seule première
          # ligne laissait passer une clé coupée, puisque l'en-tête tient dans les premiers
          # octets — essayé, et le garde était vert sur une clé de quarante caractères.
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # `tauri.conf.json` porte `"signingIdentity": "-"` — la signature ad hoc, qui est le bon
      # défaut sans certificat. La retirer ici laisse `APPLE_SIGNING_IDENTITY` décider, sans
      # dépendre d'une précédence entre la conf et l'environnement que rien ne documente. Le
      # fichier du dépôt n'est pas touché : c'est une copie de travail du runner.
      - name: laisser l'identité réelle signer
        if: env.NOTARISE == 'oui'
        run: |
          set -euo pipefail
          python3 - <<'FIN'
          import json
          from pathlib import Path
          chemin = Path("src-tauri/tauri.conf.json")
          conf = json.loads(chemin.read_text())
          retiree = conf["bundle"]["macOS"].pop("signingIdentity", None)
          assert retiree == "-", f"signingIdentity valait {retiree!r}, « - » attendu"
          chemin.write_text(json.dumps(conf, indent=2, ensure_ascii=False) + "\n")
          print("signingIdentity retirée de la copie de travail")
          FIN

      # ── Le bundle ──────────────────────────────────────────────────────────────────────
      #
      # `--target universal-apple-darwin` : un seul `.dmg` pour les deux architectures. Deux
      # fichiers séparés obligeraient l'utilisateur à savoir quel Mac il a — une question à
      # laquelle un explorateur de bases de données n'a pas à faire répondre.
      #
      # Les variables `APPLE_*` sont lues par Tauri lui-même : présentes, il signe avec
      # l'identité, soumet à `notarytool`, attend le verdict et agrafe le ticket ; absentes, il
      # signe en ad hoc et l'annonce dans son log (« skipping app notarization »).
      - run: pnpm tauri build --target universal-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Le secret s'appelle `APPLE_ISSUER_ID`, la variable que Tauri lit s'appelle
          # `APPLE_API_ISSUER` : la correspondance se fait ici, une fois.
          APPLE_API_ISSUER: ${{ secrets.APPLE_ISSUER_ID }}

      # La version affichée vient du build et elle est **figée sous Playwright** : sans quoi
      # chaque publication périmerait les captures de fidélité. La contrepartie est de vérifier
      # que le décor ne sort pas du décor — voir l'en-tête du script.
      - run: ./scripts/verifier-aucun-decor-de-version.sh

      # **Tauri notarie l'application, pas l'image.** Constaté à la 0.1.4 : l'app revient
      # « Accepted » et agrafée, et `stapler validate` sur le `.dmg` répond « does not have a
      # ticket stapled to it ». Or c'est l'image que l'utilisateur télécharge, donc elle que
      # macOS met en quarantaine et évalue à l'ouverture : sans ticket, l'avertissement
      # reparaîtrait sur l'image après avoir disparu de l'application.
      #
      # Tauri l'a bien **signée** avec l'identité — il ne manque que la soumission. L'agrafage
      # modifie le fichier, donc cette étape passe avant celle qui le copie et calcule son
      # empreinte.
      - name: notarier l'image
        if: env.NOTARISE == 'oui'
        env:
          CLEF_ID: ${{ secrets.APPLE_API_KEY }}
          EMETTEUR: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          # Le verdict est lu dans la sortie plutôt que déduit du code de retour : `notarytool
          # submit --wait` rend la main quand le traitement s'achève, ce qui n'est pas la même
          # chose que l'avoir accepté.
          sortie=$(xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$CLEF_ID" --issuer "$EMETTEUR" \
            --wait --timeout 30m 2>&1)
          echo "$sortie"
          grep -qE 'status: Accepted' <<<"$sortie"
          xcrun stapler staple "$dmg"

      - name: le bundle est bien universel
        run: |
          set -euo pipefail
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/DoraBase.app
          # `lipo -archs` liste les architectures présentes. Sans cette étape, une cible mal
          # nommée produirait un bundle mono-architecture au chemin attendu, et le `.dmg`
          # publié s'appellerait « universal » sans l'être.
          for binaire in "$app/Contents/MacOS/DoraBase" "$app/Contents/MacOS/cloud-sql-proxy"; do
            archs=$(lipo -archs "$binaire")
            echo "$binaire : $archs"
            grep -q arm64 <<<"$archs"
            grep -q x86_64 <<<"$archs"
          done

      # Même vérification que dans `ci.yml`, et pour la même raison : c'est la seule preuve
      # automatisable que le proxy est *embarqué*. Elle est refaite ici parce que c'est **ce
      # bundle-ci** qui part chez l'utilisateur, et qu'il est construit par un autre chemin
      # (cible universelle) que celui que `ci.yml` exerce.
      - name: le proxy Cloud SQL est bien dans le bundle
        run: |
          set -euo pipefail
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/DoraBase.app
          test -x "$app/Contents/MacOS/cloud-sql-proxy"
          test -f "$app/Contents/Resources/licences/cloud-sql-proxy/LICENSE"
          test -f "$app/Contents/Resources/licences/cloud-sql-proxy/VERSION"
          attendue=$(sed -n 's/^version *= *//p' src-tauri/cloud-sql-proxy.lock | head -1)
          "$app/Contents/MacOS/cloud-sql-proxy" --version | grep -F "$attendue"

      # **La signature, même ad hoc, décide si l'application se lance ailleurs.** `lipo`
      # invalide les signatures des tranches qu'il fusionne : sans une signature reprise
      # après coup, macOS refuse le bundle sur une autre machine que celle qui l'a construit
      # — et un exécutable embarqué non signé le fait refuser à coup sûr.
      # `signingIdentity: "-"` dans `tauri.conf.json` demande cette signature ad hoc à Tauri,
      # qui la pose **avant** de fabriquer le `.dmg`. Cette étape ne signe rien : elle
      # constate. Un `--verify` qui échoue veut dire que le `.dmg` déjà fabriqué est
      # inutilisable, et qu'il ne faut pas le publier.
      #
      # Ce n'est pas une notarisation. Voir le README : l'utilisateur a un geste à faire au
      # premier lancement, et il n'y a pas de Developer ID pour l'en dispenser.
      - name: le bundle est signé, et notarié si on peut
        run: |
          set -euo pipefail
          racine=src-tauri/target/universal-apple-darwin/release/bundle
          app=$racine/macos/DoraBase.app
          dmg=$(ls "$racine"/dmg/*.dmg)

          # Vrai dans les deux cas : la signature couvre tout le bundle, sidecar compris.
          codesign --verify --deep --strict --verbose=2 "$app"

          if [[ ${NOTARISE:-non} != oui ]]; then
            codesign --display --verbose=2 "$app" 2>&1 | grep -F 'Signature=adhoc'
            echo "::notice::signature ad hoc — l'utilisateur aura un geste à faire au premier lancement"
            exit 0
          fi

          # **Trois faits distincts, et aucun n'implique les autres.**
          #
          #   `Authority=Developer ID Application` : signé par le bon certificat — un ad hoc
          #     silencieusement retombé passerait `codesign --verify` sans problème ;
          #   `stapler validate` : le ticket d'Apple est **agrafé** au bundle, donc Gatekeeper
          #     l'accepte même hors ligne. Sans agrafage, l'application dépend d'un aller-retour
          #     réseau chez l'utilisateur, et échoue derrière un pare-feu ;
          #   `spctl --assess` : le verdict que rend réellement le système au lancement. C'est
          #     celui-ci qui décide si la fenêtre « Apple n'a pas pu confirmer… » paraît.
          codesign --display --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | grep -F 'source=Notarized Developer ID'

          # **Et le `.dmg` autant que l'application.** C'est lui que l'utilisateur télécharge,
          # donc lui que macOS met en quarantaine et évalue à l'ouverture. Une application
          # notariée dans une image qui ne l'est pas ferait reparaître l'avertissement — sur
          # l'image cette fois. Si cette ligne échoue, c'est que Tauri notarie l'app sans notarier
          # l'image : il faudra une soumission explicite (`notarytool submit` + `stapler staple`)
          # sur le `.dmg`, et non retirer la vérification.
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1 \
            | grep -F 'source=Notarized Developer ID'
          echo "notarié et agrafé : application et image"

      # Le nom que l'utilisateur verra dans ses téléchargements. Tauri nomme
      # `DoraBase_X.Y.Z_universal.dmg` ; le tiret et la casse du produit se lisent mieux, et
      # surtout le nom devient **prévisible** — c'est lui que le README annonce.
      - name: nommer le disque
        run: |
          set -euo pipefail
          mkdir -p publication
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          # Un seul `.dmg` attendu. Deux voudraient dire qu'un ancien traîne dans le cache,
          # et `ls` en choisirait un au hasard — donc peut-être la version d'avant.
          test "$(wc -l <<<"$dmg")" -eq 1
          cp "$dmg" "publication/DoraBase-$VERSION-universal.dmg"
          shasum -a 256 "publication/DoraBase-$VERSION-universal.dmg" \
            | sed "s|publication/||" > "publication/DoraBase-$VERSION-universal.dmg.sha256"
          ls -lh publication/

      # ── La release ─────────────────────────────────────────────────────────────────────

      - name: notes de version
        run: |
          set -euo pipefail
          precedent=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' \
            "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Installation"
            echo
            echo "**En une commande, sans avertissement.** La quarantaine est posée par le"
            echo "programme qui télécharge — navigateur ou Finder ; \`curl\` ne la pose pas."
            echo
            echo '```bash'
            echo "curl -fL -o /tmp/DoraBase.dmg \\"
            echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/DoraBase-$VERSION-universal.dmg"
            echo "hdiutil attach -quiet /tmp/DoraBase.dmg"
            echo "cp -R /Volumes/DoraBase/DoraBase.app /Applications/"
            echo "hdiutil detach -quiet /Volumes/DoraBase && open /Applications/DoraBase.app"
            echo '```'
            echo
            echo "**Ou par le navigateur** : téléchargez \`DoraBase-$VERSION-universal.dmg\`"
            echo "ci-dessous, glissez **DoraBase** dans **Applications**. macOS le refusera au"
            echo "premier lancement — il n'est pas notarié — et une commande lève ce refus :"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine /Applications/DoraBase.app'
            echo '```'
            echo
            echo "(Le clic droit ▸ *Ouvrir* ne suffit plus depuis macOS 15 ; à défaut de la"
            echo "commande, il faut passer par *Réglages Système ▸ Confidentialité et sécurité*.)"
            echo
            echo "macOS 13 Ventura ou plus récent. Bundle universel : Apple Silicon et Intel."
            echo
            echo "## Changements"
            echo
            if [[ -n $precedent ]]; then
              git log --no-merges --pretty='- %s' "$precedent..$GITHUB_REF_NAME"
              echo
              # **Accolades obligatoires.** `$precedent…` : bash range les octets non-ASCII de
              # l'ellipse *dans le nom de variable*, cherche « precedent… », ne le trouve pas, et
              # `set -u` fait échouer l'étape. La v0.1.0 y avait échappé — sans tag précédent, elle
              # passait par la branche « première version publiée ». Le défaut n'existait donc que
              # de la **deuxième** publication, là où plus personne ne relit le script.
              echo "[Comparer ${precedent}…${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${precedent}...${GITHUB_REF_NAME})"
            else
              echo "- première version publiée"
            fi
          } > publication/notes.md
          cat publication/notes.md

      - name: créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "DoraBase $VERSION" \
            --notes-file publication/notes.md \
            --latest \
            "publication/DoraBase-$VERSION-universal.dmg" \
            "publication/DoraBase-$VERSION-universal.dmg.sha256"
