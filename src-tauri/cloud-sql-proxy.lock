# Le Cloud SQL Auth Proxy embarqué dans le bundle. Voir `specs/06h-binaire-embarque.md`.
#
# **Source unique de vérité.** Le script `scripts/telecharger-proxy.sh` lit ce fichier pour
# savoir quoi télécharger et quoi vérifier ; le code Rust l'inclut pour connaître la version
# qu'il lance. Relever la version, c'est éditer ces trois lignes, et rien d'autre.
#
# Les empreintes ont été calculées le 21 août 2026 sur les fichiers téléchargés depuis
# `storage.googleapis.com/cloud-sql-connectors`. Ce ne sont pas des empreintes publiées par
# Google — le dépôt n'en publie pas — mais celles de ce que nous avons vu et embarqué. C'est
# ce qui rend une substitution ultérieure détectable, pas ce qui prouve l'origine.
#
# **Les deux triplets Linux ne servent pas à livrer**, le bundle ne ciblant que macOS. Ils sont
# là parce que déclarer un `externalBin` fait exiger le fichier par **toute** compilation, y
# compris `cargo test` sur le runner Linux de la CI (défaut n° 111). Ne pas les porter y
# rendrait le projet incompilable.
