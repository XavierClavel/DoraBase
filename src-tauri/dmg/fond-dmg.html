<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>DoraBase — fond de la fenêtre d'installation .dmg</title>

    <!--
      SOURCE de `fond-dmg.png`, `fond-dmg@2x.png` et `fond-dmg.tiff`.
      Rendu par `scripts/construire-fond-dmg.mjs` (`pnpm dmg:fond`), jamais servi par l'app.

      Deux règles à ne pas perdre :

      - **aucun numéro de version dans cette image.** Le volume porte déjà la version dans
        son nom (`version.sh`) ; la remettre ici obligerait à régénérer un bitmap à chaque
        relèvement, donc à faire dépendre `publication.yml` d'un Chromium. Le handoff le
        recommandait, `scripts/verifier-fond-dmg.sh` le fait respecter.
      - **les deux emplacements d'icônes (centres 168,233 et 492,233) restent vides.** Le
        Finder y dessine `DoraBase.app` et l'alias `Applications` — icône *et* libellé,
        police système.

      Le handoff composait ces emplacements pour des icônes de 96 pt. **Ce sont 128.** Aucune
      clef de `bundle.macOS.dmg` n'expose la taille d'icône : le bundler la fixe en dur, et la
      valeur se lit dans le `.DS_Store` du volume construit (`iconSize 128`, `textSize 16`).
      Une icône de 128 centrée à y 233 occupe donc 169 → 297, et son libellé la bande qui
      suit ; les deux lignes mono sont descendues à **y 322** pour la laisser passer — 9 pt
      au-dessus du bord bas de la carte. Retoucher la composition était le moins coûteux des
      deux remèdes : l'autre demandait de poser le `.DS_Store` soi-même, donc de rouvrir en
      écriture une image que Tauri vient de compresser en lecture seule.

      Les teintes du décor peint sont locales à cette illustration et n'ont pas vocation à
      devenir des jetons ; tout le reste vient de `src/design/tokens.css`.
    -->

    <link rel="stylesheet" href="../../src/design/tokens.css" />
    <style>
      /*
       * Les polices sont lues dans `node_modules` plutôt que chez Google : régénérer une
       * image de publication ne doit pas dépendre du réseau. Ce sont les mêmes fichiers
       * que `src/design/fonts.css` embarque dans l'app.
       */
      @font-face {
        font-family: "Baloo 2";
        font-weight: 400 800;
        font-display: block;
        src: url("../../node_modules/@fontsource-variable/baloo-2/files/baloo-2-latin-wght-normal.woff2")
          format("woff2-variations");
      }
      @font-face {
        font-family: "Nunito";
        font-weight: 200 1000;
        font-display: block;
        src: url("../../node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2")
          format("woff2-variations");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 100 800;
        font-display: block;
        src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      html,
      body {
        margin: 0;
        background: #cfeef6;
      }

      /* 660 × 440 pt : la zone de contenu de la fenêtre du volume, hors barre de titre. */
      #fond-dmg {
        position: relative;
        width: 660px;
        height: 440px;
        overflow: hidden;
        background: #cfeef6;
        font-family: var(--font-ui);
      }

      #fond-dmg svg.decor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Couche 3 — vignette : assied la carte sur le décor. */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 45%, rgba(35, 32, 28, 0), rgba(35, 32, 28, 0.14));
      }

      /* Couche 4 — la carte de dépôt. Rayon 18px : hors échelle (--radius-window vaut 14px). */
      .carte {
        position: absolute;
        left: 54px;
        top: 92px;
        width: 552px;
        height: 252px;
        box-sizing: border-box;
        border-radius: 18px;
        background: var(--paper);
        box-shadow:
          0 22px 46px -20px rgba(35, 32, 28, 0.55),
          0 0 0 1px var(--border);
      }

      .bloc {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .titre {
        left: 80px;
        top: 112px;
        width: 500px;
        height: 31px;
        font-family: var(--font-title);
        font-size: 19px; /* métrique locale : hors échelle --text-* */
        font-weight: 700;
        letter-spacing: 0.1px;
        color: var(--ink);
      }

      .sous-titre {
        left: 80px;
        top: 146px;
        width: 500px;
        height: 17px;
        font-size: var(--text-body);
        font-weight: 400;
        color: var(--ink-2);
      }

      .legende-glisser {
        left: 265px;
        top: 207px;
        width: 130px;
        height: 13px;
        font-family: var(--font-mono);
        font-size: var(--text-caps-sm);
        font-weight: 500;
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--ink-meta);
      }

      /* Indicateur « glisser » : deux filets pointillés et trois chevrons en rampe. */
      .fleche {
        left: 271px;
        top: 228px;
        width: 119px;
        height: 22px;
        gap: 5px;
      }

      .fleche .filet {
        width: 30px;
        border-top: 2px dashed rgba(35, 32, 28, 0.22); /* --border-dashed, monté à .22 */
      }

      /* viewBox recadrée : le chevron du sprite occupe toute la boîte de 13 × 22. */
      .fleche svg {
        width: 13px;
        height: 22px;
      }

      .fleche svg:nth-of-type(1) {
        opacity: 0.4;
      }
      .fleche svg:nth-of-type(2) {
        opacity: 0.7;
      }

      .fleche path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Sous le libellé que le Finder dessine, pas à sa place — voir l'en-tête : l'icône
         fait 128 pt, pas 96, et son libellé descend d'autant. */
      .sous-icone {
        top: 322px;
        width: 200px;
        height: 13px;
        font-family: var(--font-mono);
        font-size: var(--text-caps-sm);
        font-weight: 400;
        letter-spacing: 0.3px;
        color: var(--ink-meta);
      }

      .sous-icone.gauche {
        left: 68px;
      }
      .sous-icone.droite {
        left: 392px;
      }

      .pastille-rangee {
        left: 0;
        top: 395px;
        width: 660px;
        height: 23px;
      }

      .pastille {
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(251, 247, 239, 0.82); /* --paper à .82 */
        box-shadow: 0 0 0 1px rgba(35, 32, 28, 0.1);
        font-family: var(--font-mono);
        font-size: var(--text-meta);
        font-weight: 500;
        letter-spacing: 0.2px;
        color: rgba(35, 32, 28, 0.6);
      }
    </style>
  </head>
